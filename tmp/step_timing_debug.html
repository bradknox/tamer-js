<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Step Timing Debug</title>
    <style>
        body { font-family: monospace; margin: 20px; background: #1e1e1e; color: #d4d4d4; }
        .controls { margin: 10px 0; }
        button { margin: 5px; padding: 8px 16px; }
        input[type="range"] { width: 300px; }
        pre { background: #2d2d2d; padding: 10px; white-space: pre-wrap; max-height: 400px; overflow: auto; }
        .highlight { color: #4ec9b0; }
        canvas { border: 1px solid #666; }
    </style>
</head>
<body>
    <h1>Step Timing Debug</h1>

    <div class="controls">
        <label>Step Duration (ms): <input type="range" id="speed-slider" min="0.001" max="500" value="200" step="0.001"></label>
        <span id="speed-display">200ms</span>
    </div>

    <div class="controls">
        <button onclick="startTest()">Start Test</button>
        <button onclick="stopTest()">Stop Test</button>
        <button onclick="clearLog()">Clear Log</button>
    </div>

    <div class="controls">
        <span>Calculated stepsPerFrame: <strong id="steps-per-frame">-</strong></span>
    </div>

    <canvas id="test-canvas" width="200" height="200"></canvas>

    <h3>Log (last 50 entries):</h3>
    <pre id="output"></pre>

    <script type="module">
        import { TamerApp } from '../js/main.js?v=27';

        const output = document.getElementById('output');
        const speedSlider = document.getElementById('speed-slider');
        const speedDisplay = document.getElementById('speed-display');
        const stepsPerFrameDisplay = document.getElementById('steps-per-frame');

        let app = null;
        let logLines = [];
        let frameCount = 0;
        let stepCount = 0;
        let lastLogTime = 0;

        function log(msg) {
            logLines.push(msg);
            if (logLines.length > 50) logLines.shift();
            output.textContent = logLines.join('\n');
            output.scrollTop = output.scrollHeight;
        }

        window.clearLog = function() {
            logLines = [];
            output.textContent = '';
        };

        function updateStepsPerFrame(stepDurationMs) {
            const stepsPerFrame = Math.max(1, Math.floor(16 / Math.max(0.001, stepDurationMs)));
            stepsPerFrameDisplay.textContent = stepsPerFrame;
            speedDisplay.textContent = stepDurationMs < 1 ? `${stepDurationMs.toFixed(3)}ms` : `${stepDurationMs.toFixed(1)}ms`;
            return stepsPerFrame;
        }

        speedSlider.addEventListener('input', (e) => {
            const speed = parseFloat(e.target.value);
            updateStepsPerFrame(speed);
            if (app) {
                app.setStepDuration(speed);
            }
        });

        window.startTest = function() {
            if (app) {
                app.stop();
            }

            const stepDurationMs = parseFloat(speedSlider.value);
            const stepsPerFrame = updateStepsPerFrame(stepDurationMs);

            log(`\n=== Starting test ===`);
            log(`stepDurationMs: ${stepDurationMs}`);
            log(`stepsPerFrame: ${stepsPerFrame}`);
            log(`Expected: ${stepsPerFrame} steps per render\n`);

            frameCount = 0;
            stepCount = 0;

            app = new TamerApp('test-canvas', {
                environment: 'mountaincar',
                stepDurationMs: stepDurationMs
            });

            // Intercept to count steps and frames
            const originalDoStep = app._doStep.bind(app);
            const originalRender = app._render.bind(app);
            let stepsThisFrame = 0;
            let frameStartTime = performance.now();

            app._doStep = function(time) {
                stepCount++;
                stepsThisFrame++;
                return originalDoStep(time);
            };

            app._render = function() {
                frameCount++;
                const now = performance.now();
                const frameTime = now - frameStartTime;

                // Log every 500ms
                if (now - lastLogTime > 500) {
                    log(`Frame ${frameCount}: ${stepsThisFrame} steps in ${frameTime.toFixed(1)}ms`);
                    lastLogTime = now;
                }

                stepsThisFrame = 0;
                frameStartTime = now;
                return originalRender();
            };

            app.start();
            log('Test running... (logging every 500ms)');
        };

        window.stopTest = function() {
            if (app) {
                app.stop();
                log(`\n=== Test stopped ===`);
                log(`Total frames: ${frameCount}`);
                log(`Total steps: ${stepCount}`);
                log(`Average steps/frame: ${(stepCount / frameCount).toFixed(2)}`);
            }
        };

        // Initialize display
        updateStepsPerFrame(parseFloat(speedSlider.value));

        log('Step Timing Debug loaded.');
        log('');
        log('This tool shows exactly how many steps run per render frame.');
        log('');
        log('Move the slider to see how stepsPerFrame changes:');
        log('  - At 200ms: stepsPerFrame = floor(16/200) = 0 -> clamped to 1');
        log('  - At 16ms:  stepsPerFrame = floor(16/16) = 1');
        log('  - At 1ms:   stepsPerFrame = floor(16/1) = 16');
        log('  - At 0.001ms: stepsPerFrame = floor(16/0.001) = 16000');
        log('');
        log('Click "Start Test" to run and see actual behavior.');
    </script>
</body>
</html>
