<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Fast Exp Approximation Test</title>
    <style>
        body { font-family: monospace; margin: 20px; background: #1e1e1e; color: #d4d4d4; }
        button { margin: 5px; padding: 10px 20px; }
        pre { background: #2d2d2d; padding: 10px; white-space: pre-wrap; }
        .good { color: #4ec9b0; }
        .warn { color: #dcdcaa; }
        .bad { color: #f14c4c; }
    </style>
</head>
<body>
    <h1>Fast Exp Approximation Test</h1>
    <p>Ported from Java FeatGen_RBFs.java - Schraudolph (1999) algorithm</p>

    <div>
        <button onclick="testAccuracy()">Test Accuracy</button>
        <button onclick="testPerformance()">Test Performance</button>
        <button onclick="testRBFPerformance()">Test Full RBF Performance</button>
        <button onclick="clearOutput()">Clear</button>
    </div>

    <pre id="output"></pre>

    <script>
        const output = document.getElementById('output');
        function log(msg) { output.textContent += msg + '\n'; }
        window.clearOutput = function() { output.textContent = ''; };

        // ============================================================
        // FAST EXP IMPLEMENTATION - Schraudolph (1999)
        // Ported from Java FeatGen_RBFs.java
        // ============================================================

        // Pre-allocate buffer for bit manipulation
        const fastExpBuffer = new ArrayBuffer(8);
        const fastExpUint32 = new Uint32Array(fastExpBuffer);
        const fastExpFloat64 = new Float64Array(fastExpBuffer);

        /**
         * Fast approximation of exp() using Schraudolph's algorithm.
         *
         * From Java:
         *   final long tmp = (long)(1512775 * val + 1072632447);
         *   return Double.longBitsToDouble(tmp << 32);
         *
         * The trick: in IEEE 754 double format, setting the high 32 bits
         * to a linear function of the input approximates exp().
         */
        function fastExp(val) {
            if (val < -709.0) return 0.0;      // underflow protection
            if (val > 709.0) return 1.7976931348623157e+308;  // overflow protection (MAX_VALUE)

            // Compute the value that goes in the high 32 bits
            // Using Math.trunc to match Java's (long) cast behavior
            const tmp = Math.trunc(1512775 * val + 1072632447);

            // In IEEE 754 double (little-endian on most systems):
            // - Bytes 0-3 are the low 32 bits of mantissa
            // - Bytes 4-7 are sign + exponent + high 20 bits of mantissa
            //
            // Java's `tmp << 32` puts tmp in high bits, zeros in low bits.
            // On little-endian: low bits at index 0, high bits at index 1
            fastExpUint32[0] = 0;              // low 32 bits = 0
            fastExpUint32[1] = tmp >>> 0;      // high 32 bits = tmp (>>> 0 ensures unsigned)

            return fastExpFloat64[0];
        }

        // Alternative using DataView (more explicit about endianness)
        const dvBuffer = new ArrayBuffer(8);
        const dvView = new DataView(dvBuffer);

        function fastExpDataView(val) {
            if (val < -709.0) return 0.0;
            if (val > 709.0) return 1.7976931348623157e+308;

            const tmp = Math.trunc(1512775 * val + 1072632447);

            // IEEE 754 double: we want tmp in the HIGH 32 bits
            // DataView with littleEndian=true: bytes 4-7 are high bits
            dvView.setUint32(0, 0, true);        // low 32 bits
            dvView.setUint32(4, tmp >>> 0, true); // high 32 bits

            return dvView.getFloat64(0, true);
        }

        // ============================================================
        // TESTS
        // ============================================================

        window.testAccuracy = function() {
            log('\n=== ACCURACY TEST ===\n');
            log('Comparing fastExp() to Math.exp()\n');

            const testValues = [
                -709, -100, -50, -10, -5, -2, -1, -0.5, -0.1, 0,
                0.1, 0.5, 1, 2, 5, 10, 50, 100, 709
            ];

            log('  Input        Math.exp()           fastExp()            Error %');
            log('  -----        ----------           ---------            -------');

            let maxError = 0;
            let avgError = 0;
            let count = 0;

            for (const val of testValues) {
                const exact = Math.exp(val);
                const approx = fastExp(val);
                const error = exact !== 0 ? Math.abs((approx - exact) / exact) * 100 : 0;

                maxError = Math.max(maxError, error);
                avgError += error;
                count++;

                const errorClass = error < 1 ? 'good' : error < 5 ? 'warn' : 'bad';
                log(`  ${val.toString().padStart(5)}    ${exact.toExponential(8).padStart(18)}    ${approx.toExponential(8).padStart(18)}    ${error.toFixed(4)}%`);
            }

            avgError /= count;
            log(`\nMax error: ${maxError.toFixed(4)}%`);
            log(`Avg error: ${avgError.toFixed(4)}%`);
            log('\nNote: Schraudolph approximation typically has <5% error in the useful range.');
        };

        window.testPerformance = function() {
            log('\n=== PERFORMANCE TEST ===\n');
            log('Running 1,000,000 iterations of each...\n');

            const iterations = 1000000;
            const testVal = -0.5;  // typical value in RBF computation
            let sum = 0;

            // Warmup
            for (let i = 0; i < 10000; i++) {
                sum += Math.exp(testVal * i / 10000);
                sum += fastExp(testVal * i / 10000);
            }

            // Test Math.exp
            sum = 0;
            const startMathExp = performance.now();
            for (let i = 0; i < iterations; i++) {
                sum += Math.exp(testVal);
            }
            const mathExpTime = performance.now() - startMathExp;
            log(`Math.exp():  ${mathExpTime.toFixed(2)} ms  (sum=${sum.toFixed(4)} for verification)`);

            // Test fastExp
            sum = 0;
            const startFastExp = performance.now();
            for (let i = 0; i < iterations; i++) {
                sum += fastExp(testVal);
            }
            const fastExpTime = performance.now() - startFastExp;
            log(`fastExp():   ${fastExpTime.toFixed(2)} ms  (sum=${sum.toFixed(4)} for verification)`);

            // Test fastExpDataView
            sum = 0;
            const startDV = performance.now();
            for (let i = 0; i < iterations; i++) {
                sum += fastExpDataView(testVal);
            }
            const dvTime = performance.now() - startDV;
            log(`fastExpDV(): ${dvTime.toFixed(2)} ms  (sum=${sum.toFixed(4)} for verification)`);

            log(`\nSpeedup (Math.exp / fastExp): ${(mathExpTime / fastExpTime).toFixed(2)}x`);
            log(`Speedup (Math.exp / fastExpDV): ${(mathExpTime / dvTime).toFixed(2)}x`);

            if (fastExpTime < mathExpTime) {
                log('\n✓ fastExp is FASTER than Math.exp');
            } else {
                log('\n✗ fastExp is SLOWER than Math.exp (modern JS engines optimize Math.exp well)');
            }
        };

        window.testRBFPerformance = function() {
            log('\n=== FULL RBF COMPUTATION TEST ===\n');
            log('Simulating Mountain Car RBF features (1600 means, 2D obs)\n');

            const numMeans = 1600;  // 40^2 for Mountain Car
            const numDims = 2;
            const iterations = 1000;

            // Generate random means and observation
            const means = [];
            for (let i = 0; i < numMeans; i++) {
                means.push([Math.random() * 2 - 1, Math.random() * 0.14 - 0.07]);
            }
            const obs = [-0.5, 0.02];
            const width = 0.002;  // typical RBF width

            // Function to compute RBF features with Math.exp
            function computeRBFMathExp() {
                const feats = new Array(numMeans);
                for (let i = 0; i < numMeans; i++) {
                    const mean = means[i];
                    let sqrdDist = 0;
                    for (let d = 0; d < numDims; d++) {
                        const diff = obs[d] - mean[d];
                        sqrdDist += diff * diff;
                    }
                    feats[i] = Math.exp(-0.5 * sqrdDist / width);
                }
                return feats;
            }

            // Function to compute RBF features with fastExp
            function computeRBFFastExp() {
                const feats = new Array(numMeans);
                for (let i = 0; i < numMeans; i++) {
                    const mean = means[i];
                    let sqrdDist = 0;
                    for (let d = 0; d < numDims; d++) {
                        const diff = obs[d] - mean[d];
                        sqrdDist += diff * diff;
                    }
                    feats[i] = fastExp(-0.5 * sqrdDist / width);
                }
                return feats;
            }

            // Warmup
            for (let i = 0; i < 10; i++) {
                computeRBFMathExp();
                computeRBFFastExp();
            }

            // Test Math.exp version
            const startMath = performance.now();
            for (let i = 0; i < iterations; i++) {
                computeRBFMathExp();
            }
            const mathTime = performance.now() - startMath;

            // Test fastExp version
            const startFast = performance.now();
            for (let i = 0; i < iterations; i++) {
                computeRBFFastExp();
            }
            const fastTime = performance.now() - startFast;

            log(`Math.exp version: ${mathTime.toFixed(2)} ms for ${iterations} iterations`);
            log(`fastExp version:  ${fastTime.toFixed(2)} ms for ${iterations} iterations`);
            log(`\nPer-iteration: Math.exp=${(mathTime/iterations).toFixed(3)}ms, fastExp=${(fastTime/iterations).toFixed(3)}ms`);
            log(`Speedup: ${(mathTime / fastTime).toFixed(2)}x`);

            // Compare accuracy of one computation
            const mathFeats = computeRBFMathExp();
            const fastFeats = computeRBFFastExp();
            let maxErr = 0;
            for (let i = 0; i < numMeans; i++) {
                const err = Math.abs(mathFeats[i] - fastFeats[i]) / Math.max(1e-10, mathFeats[i]);
                maxErr = Math.max(maxErr, err);
            }
            log(`\nMax relative error in features: ${(maxErr * 100).toFixed(4)}%`);
        };

        log('Fast Exp Test loaded.');
        log('');
        log('This tests Schraudolph (1999) fast exp approximation ported from Java.');
        log('');
        log('The Java implementation:');
        log('  final long tmp = (long)(1512775 * val + 1072632447);');
        log('  return Double.longBitsToDouble(tmp << 32);');
        log('');
        log('Click buttons to run tests.');
    </script>
</body>
</html>
